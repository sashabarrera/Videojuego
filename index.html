<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Sasha Barrera">
    <title>Super Plataformas</title>
    <style>
        :root {
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 30%, #2b3a67, #0d1226);
            font-family: "Courier New", monospace;
            color: #eee
        }

        h1 {
            margin: 0 0 12px;
            letter-spacing: 4px;
            font-size: 24px;
            text-shadow: 3px 3px #c0281f
        }

        .wrap {
            position: relative;
            width: 800px;
            max-width: 96vw;
            aspect-ratio: 16/9;
            border: 6px solid #f8c030;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 0, 0, .7);
            background: #000;
            overflow: hidden
        }

        .wrap canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block
        }

        .help {
            margin: 12px 0 0;
            font-size: 14px;
            opacity: .85;
            text-align: center;
            line-height: 1.5
        }

        kbd {
            background: #333;
            border: 1px solid #777;
            border-radius: 4px;
            padding: 1px 6px
        }
    </style>
</head>

<body>
    <h1>SUPER PLATAFORMAS</h1>
    <div class="wrap" id="wrap"><canvas id="g3" width="800" height="450"></canvas><canvas id="c" width="800"
            height="450"></canvas></div>
    <p class="help"><kbd>←</kbd> <kbd>→</kbd> mover · <kbd>↑</kbd> saltar / nadar · <kbd>↓</kbd> o <kbd>S</kbd> entrar a
        la tubería · <kbd>Enter</kbd> empezar</p>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        "use strict";
        const cv = document.getElementById('c'), ctx = cv.getContext('2d');
        const W = 800, H = 450, GY = 386, BY = 258, k = 1 / 32;
        const CFG = { camDist: 19.5, camTilt: 2.5, camSide: -3, camLerp: .08, sunBoost: 1, ambBoost: 1, shake: .4 };

        /* ---------- Entrada ---------- */
        const K = {}; let pressed = {};
        addEventListener('keydown', e => { if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault(); if (!K[e.key]) pressed[e.key] = true; K[e.key] = true; });
        addEventListener('keyup', e => { K[e.key] = false; });
        document.getElementById('wrap').addEventListener('click', () => { pressed.Enter = true; });
        const pDown = () => pressed.ArrowDown || pressed.s || pressed.S;
        const upKey = () => K.ArrowUp || K[' '], pUp = () => pressed.ArrowUp || pressed[' '];

        /* ---------- Sprites originales ---------- */
        const MA = ["...RRRRR....", "..RRRRRRRRR.", "..BBBSSBS...", ".BSBSSSBSSS.", ".BSBBSSSBSSS", ".BBSSSSBBBB.", "...SSSSSSS..", "..RRURRR....", ".RRRURRURRR.", "RRRRUUUURRRR", "SSRUYUUYURSS", "SSSUUUUUUSSS", "SSUUUUUUUUSS", "..UUU..UUU..", ".BBB....BBB.", "BBBB....BBBB"];
        const PM = { R: '#e52521', S: '#ffc48c', B: '#6b3a10', U: '#2038ec', Y: '#fcd800' };
        const GOOM = ["....BBBB....", "...BBBBBB...", "..BBBBBBBB..", ".BBWKBBKWBB.", ".BBWWBBWWBB.", "BBBBBBBBBBBB", "BBBBBBBBBBBB", "...SSSSSS...", "...SSSSSS...", "..KKSSSSKK..", ".KKKK..KKKK.", "KKKKK..KKKKK"];
        const PG = { B: '#a0522d', W: '#fff', K: '#000', S: '#f0c8a0' };
        const KOOP = [".....SSSS...", ".....SSKS...", ".....SSSSS..", "..GGGG.SS...", ".GGLLGGSS...", "GGLGGLGGS...", "GLGGGGLGG...", "GGLGGLGGW...", ".GGGGGGWW...", "..WWWWWW....", "..SS..SS....", ".SSS.SSS...."];
        const PK = { S: '#f8d878', K: '#000', G: '#00a800', L: '#80f080', W: '#fff8d0' };
        const BLOO = ["...WWWW...", "..WWWWWW..", ".WWWWWWWW.", ".WKWWWWKW.", ".WWWWWWWW.", "..WWWWWW..", "..WWWWWW..", ".WWWWWWWW.", ".W.WW.WW.W", "W..W..W..W"];
        const PB = { W: '#f4f4f4', K: '#101040', B: '#4a6a9a' };
        const MUSH = ["..RRRR..", ".RRWWRR.", "RRWWWWRR", "RRRWWRRR", "RRRRRRRR", "..SSSS..", ".SKSSKS.", "..SSSS.."];
        const PU = { R: '#e52521', W: '#fff', S: '#ffe0b0', K: '#000' };
        function mk(w, h, parts, details) {
            const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.translate(1, 1);
            g.fillStyle = '#000'; for (const p of parts) g.fillRect(p[0] - 1, p[1] - 1, p[2] + 2, p[3] + 2);
            for (const p of parts.concat(details)) { g.fillStyle = p[4]; g.fillRect(p[0], p[1], p[2], p[3]); } return c;
        }
        const RD = '#e52521', SK = '#ffc48c', GR = '#58c838', OR = '#f08020', WH = '#f8f8f8';
        const YC = mk(23, 23, [[0, 12, 4, 3, GR], [4, 16, 3, 3, GR], [10, 16, 3, 3, GR], [3, 18, 6, 3, OR], [9, 18, 6, 3, OR], [3, 9, 11, 8, GR], [9, 12, 5, 5, WH], [12, 4, 4, 8, GR], [12, 1, 8, 7, GR], [17, 4, 4, 5, GR], [14, 0, 3, 4, WH], [4, 8, 7, 3, RD]],
            [[16, 1, 1, 2, '#000'], [19, 5, 1, 1, '#2a6a18'], [18, 7, 2, 1, '#c03030']]);
        const B_OR = '#f08a1c', B_OD = '#c8680c', B_CR = '#f8d8a8', B_GN = '#2aa040', B_GD = '#1a7a30', B_YE = '#f8d030', B_GY = '#808080', B_HR = '#e85a14';
        const DC = mk(50, 42, [[37, 31, 10, 5, B_OR], [44, 28, 3, 5, B_YE], [17, 32, 10, 6, B_OR], [30, 32, 10, 6, B_OR], [13, 36, 13, 4, B_OR], [28, 36, 14, 4, B_OR], [15, 18, 24, 15, B_OR], [14, 23, 9, 9, B_CR], [24, 10, 18, 20, B_GN], [22, 12, 3, 17, '#fff'], [27, 2, 4, 9, B_YE], [34, 4, 4, 7, B_YE], [41, 12, 6, 5, B_YE], [41, 21, 6, 5, B_YE], [3, 22, 13, 6, B_OR], [11, 20, 4, 9, B_GY], [15, 17, 8, 4, B_GY], [2, 8, 16, 11, B_CR], [6, 18, 12, 4, B_CR], [14, 0, 14, 8, B_HR], [10, 5, 10, 5, B_GN], [10, 0, 4, 6, B_YE], [24, 0, 4, 5, B_YE]],
            [[11, 9, 5, 4, '#fff'], [11, 10, 2, 3, '#000'], [10, 8, 7, 1, B_GD], [3, 10, 3, 1, B_OD], [7, 14, 8, 4, '#c01818'], [8, 14, 1, 1, '#fff'], [11, 14, 1, 1, '#fff'], [14, 14, 1, 1, '#fff'], [9, 17, 1, 1, '#fff'], [13, 17, 1, 1, '#fff'], [4, 17, 1, 2, '#fff'], [12, 22, 2, 2, '#fff'], [12, 26, 2, 2, '#fff'], [17, 18, 2, 2, '#fff'], [20, 18, 2, 2, '#fff'], [1, 23, 3, 2, '#fff'], [1, 26, 3, 2, '#fff'], [3, 29, 3, 2, '#fff'], [14, 38, 2, 2, '#fff'], [17, 38, 2, 2, '#fff'], [20, 38, 2, 2, '#fff'], [30, 38, 2, 2, '#fff'], [33, 38, 2, 2, '#fff'], [36, 38, 2, 2, '#fff'], [28, 3, 1, 5, '#c8a010'], [35, 5, 1, 4, '#c8a010'], [42, 13, 3, 1, '#c8a010'], [42, 22, 3, 1, '#c8a010'], [28, 14, 3, 3, B_GD], [32, 20, 4, 4, B_GD], [30, 26, 8, 2, B_GD], [16, 21, 4, 1, B_OD], [16, 30, 6, 1, B_OD]]);

        /* ---------- Estado ---------- */
        const TH = { land: { sky: '#5c94fc', g: '#00a800', gb: '#c84c0c' }, water: { sky: '#0a2468', g: '#e0c080', gb: '#b8944a' }, castle: { sky: '#150808', g: '#8a8a8a', gb: '#4a4a4a' } };
        const NAMES = { land: 'MUNDO 1 · TIERRA', water: 'MUNDO 2 · AGUA', castle: 'MUNDO 3 · CASTILLO' };
        let state = 'title', lives = 3, score = 0, frame = 0, cam = 0, S = null, fade = 0, fdir = 0, next = null, winT = 0, shk = 0;
        const P = { x: 0, y: 0, w: 24, h: 32, vx: 0, vy: 0, big: false, mount: false, face: 1, inv: 0, freeze: 0, sh: 32, tsh: 32, dead: 0, dt: 0, isP: true };

        const seg = (a, b, y, h) => ({ x: a, y, w: b - a, h: h || H - y, t: 'g' });
        const blk = (x, t, item) => ({ x, y: BY, w: 32, h: 32, t, item, bump: 0 });
        const pipe = (x, h, to, base) => ({ x, y: (base || GY) - h, w: 64, h, t: 'p', to });
        const goomba = x => ({ k: 'g', x, y: GY - 32, w: 32, h: 32, vx: 0, vy: 0, d: -1, sp: .8, alive: 1, sq: 0 });
        const koopa = x => ({ k: 'k', x, y: GY - 40, w: 32, h: 40, vx: 0, vy: 0, d: -1, sp: 1.1, alive: 1, sq: 0 });
        const blooper = (x, y) => ({ k: 'b', bx: x, by: y, x, y, w: 32, h: 40, t: Math.random() * 99, alive: 1, sq: 0 });
        const plant = (x, y) => ({ k: 'p', x, y, w: 40, h: 50, baseY: y, t: Math.random() * 99, up: 0, alive: 1, sq: 0 });
        const cheep = (x, y, axis) => ({ k: 'c', x, y, w: 44, h: 36, vx: axis === 'x' ? 1.4 : 0, vy: axis === 'y' ? 1.0 : 0, axis, t: Math.random() * 99, alive: 1, sq: 0 });

        function build(n) {
            const s = { name: n, solids: [], en: [], items: [], pop: [], chips: [], fb: [], D: null, goal: null };
            if (n === 'land') {
                s.w = 2600; s.grav = .55; s.spawn = [60, GY - 32];
                [[0, 700], [790, 1400], [1490, 2600]].forEach(a => s.solids.push(seg(a[0], a[1], GY)));
                s.solids.push(blk(416, 'b'), blk(448, 'q', 'm'), blk(480, 'b'), blk(512, 'q', 'c'), blk(544, 'b'), pipe(640, 64),
                    blk(960, 'b'), blk(992, 'q', 'm'), blk(1024, 'b'), pipe(1250, 96),
                    blk(1560, 'q', 'c'), blk(1592, 'b'), blk(1624, 'q', 'm'), blk(1656, 'b'), pipe(1900, 64), pipe(2300, 64, 'water'));
                s.en = [goomba(520), goomba(880), goomba(1120), goomba(1700), goomba(2050), koopa(1000), koopa(1580), koopa(1800), koopa(2150),
                plant(652, GY - 64 - 50), plant(1262, GY - 96 - 50), plant(1912, GY - 64 - 50)];
                s.items.push({ k: 'y', x: 240, y: GY - 46, w: 48, h: 46 });
            } else if (n === 'water') {
                s.w = 1800; s.grav = .15; s.spawn = [70, 60];
                s.solids.push({ x: 0, y: 400, w: 1800, h: 50, t: 'g' }, { x: 350, y: 330, w: 96, h: 70, t: 'r' }, { x: 650, y: 250, w: 96, h: 150, t: 'r' },
                    { x: 980, y: 330, w: 128, h: 70, t: 'r' }, { x: 1250, y: 270, w: 96, h: 130, t: 'r' }, pipe(1650, 64, 'castle', 400));
                s.en = [blooper(500, 140), blooper(800, 200), blooper(1150, 120), blooper(1450, 220),
                cheep(280, 180, 'x'), cheep(710, 260, 'x'), cheep(1010, 150, 'y'), cheep(1360, 300, 'x'), cheep(1610, 120, 'y')];
            } else {
                s.w = 1000; s.grav = .55; s.spawn = [60, GY - 32];
                s.solids.push(seg(0, 300, GY, 20), seg(390, 1000, GY, 20));
                s.D = { x: 760, y: GY - 80, w: 96, h: 80, hp: 5, t: 0, d: -1, inv: 0, dying: 0 };
                s.goal = { x: 950, y: GY - 110, w: 20, h: 110 };
            }
            return s;
        }
        function load(n, keep) {
            S = build(n);
            if (!keep) setForm(false, false), P.sh = P.tsh = 32, P.inv = 60;
            P.x = S.spawn[0]; P.y = S.spawn[1] - (P.h - 32); P.vx = P.vy = 0; P.dead = 0;
            mkBG(n); clearDyn(); camFirst = 1;
        }
        function go(n) { if (!fdir) { next = n; fdir = 1; } }
        function setForm(big, mount) {
            const cx = P.x + P.w / 2, bot = P.y + P.h;
            P.big = big; P.mount = mount;
            P.w = (big || mount) ? 48 : 24;
            P.h = (big ? 64 : 32) + (mount ? 26 : 0);
            P.tsh = big ? 64 : 32;
            P.x = cx - P.w / 2; P.y = bot - P.h;
            for (const s of S.solids) if (hit(P, s) && s.y < P.y + P.h - 4 && s.y + s.h > P.y + 10) P.x = (P.x + P.w / 2 < s.x + s.w / 2) ? s.x - P.w : s.x + s.w;
        }
        function hurt() {
            if (P.inv > 0 || P.dead) return;
            if (P.mount) { setForm(P.big, false); P.inv = 90; P.vy = -5; }
            else if (P.big) { setForm(false, false); P.inv = 90; P.freeze = 20; }
            else die(false);
        }
        function die(fall) { if (P.dead) return; P.dead = 1; P.dt = fall ? 60 : 0; P.vy = fall ? 0 : -9; lives--; }
        function afterDeath() { if (lives <= 0) { state = 'over'; return; } load(S.name, false); }

        /* ---------- Física ---------- */
        const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        const solidAt = (px, py) => S.solids.some(s => px >= s.x && px < s.x + s.w && py >= s.y && py < s.y + s.h);
        function move(b, g) {
            b.vy = Math.min(b.vy + g, 14); b.hitX = false; b.bump = null;
            b.x += b.vx;
            for (const s of S.solids) if (hit(b, s)) { b.hitX = true; if (b.vx > 0) b.x = s.x - b.w; else if (b.vx < 0) b.x = s.x + s.w; if (b.isP) b.vx = 0; }
            b.y += b.vy; b.ground = false;
            if (b.vy > 0) { for (const s of S.solids) if (hit(b, s)) { b.y = s.y - b.h; b.vy = 0; b.ground = true; } }
            else if (b.vy < 0) {
                let best = null, bo = 0, ny = -1e9;
                for (const s of S.solids) if (hit(b, s)) { const o = Math.min(b.x + b.w, s.x + s.w) - Math.max(b.x, s.x); if (o > bo) { bo = o; best = s; } ny = Math.max(ny, s.y + s.h); }
                if (best) { b.y = ny; b.vy = 0; b.bump = best; }
            }
        }
        function addPop(x, y, txt) { S.pop.push({ x, y, t: 50, txt }); spawnFx(x + 16, y + 10, '#ffe040', 6); }
        function bumpBlock(s) {
            if (s.t === 'q') {
                s.t = 'u'; s.bump = 10;
                if (s.item === 'm') S.items.push({ k: 'm', x: s.x + 2, y: s.y - 30, w: 28, h: 28, vx: 1.6, vy: -3 });
                else { score += 100; addPop(s.x, s.y - 10, '+100'); }
            } else if (s.t === 'b') {
                if (P.big) {
                    S.solids.splice(S.solids.indexOf(s), 1); score += 50; addPop(s.x, s.y - 10, '+50');
                    for (let i = 0; i < 4; i++)S.chips.push({ x: s.x + (i % 2) * 16, y: s.y + (i >> 1) * 16, vx: (i % 2 ? 2 : -2), vy: -6 - (i >> 1) * 2, t: 50 });
                } else { s.bump = 10; score += 10; addPop(s.x, s.y - 10, '+10'); }
            }
        }

        /* ---------- Update ---------- */
        function updP() {
            if (P.dead) { P.vy += .5; P.y += P.vy; if (++P.dt > 90) afterDeath(); return; }
            const water = S.name === 'water';
            const dir = (K.ArrowRight ? 1 : 0) - (K.ArrowLeft ? 1 : 0);
            if (dir) P.face = dir;
            P.vx += (dir * (water ? 2.2 : 3.4) - P.vx) * .25;
            if (water) {
                if (pUp()) P.vy = -2.6;
                if (upKey()) P.vy -= .32;
                P.vy = Math.max(-2.8, Math.min(2, P.vy));
            } else {
                if (pUp() && P.ground) P.vy = -(P.mount ? 14 : P.big ? 12.8 : 12.4);
                if (!upKey() && P.vy < -4) P.vy = -4;
            }
            move(P, S.grav);
            if (P.bump && (P.bump.t === 'b' || P.bump.t === 'q')) bumpBlock(P.bump);
            if (P.x < 0) P.x = 0; if (P.x + P.w > S.w) P.x = S.w - P.w;
            if (P.y < 0 && water) { P.y = 0; P.vy = 0; }
            P.sh += Math.sign(P.tsh - P.sh) * Math.min(4, Math.abs(P.tsh - P.sh));
            if (P.inv > 0) P.inv--;
            if (P.y > H + 40) die(true);
            if (pDown() && P.ground) {
                for (const s of S.solids) if (s.t === 'p' && s.to && Math.abs(P.y + P.h - s.y) < 3 && P.x + P.w / 2 > s.x + 6 && P.x + P.w / 2 < s.x + s.w - 6) { go(s.to); break; }
            }
        }
        function update() {
            frame++;
            if (fdir) {
                fade += fdir * .06;
                if (fdir > 0 && fade >= 1) { load(next, true); fdir = -1; }
                else if (fdir < 0 && fade <= 0) { fade = 0; fdir = 0; }
                return;
            }
            if (state !== 'play') {
                if (pressed.Enter) { if (state === 'title') state = 'play'; else { lives = 3; score = 0; state = 'play'; load('land', false); } }
                return;
            }
            if (P.freeze > 0) { P.freeze--; P.sh += Math.sign(P.tsh - P.sh) * Math.min(4, Math.abs(P.tsh - P.sh)); return; }
            updP();
            cam = Math.max(0, Math.min(S.w - W, P.x + P.w / 2 - W / 2));
            if (P.dead) return;
            for (const s of S.solids) if (s.bump > 0) s.bump--;
            for (let i = S.items.length - 1; i >= 0; i--) {
                const it = S.items[i];
                if (it.k === 'm') { move(it, S.grav); if (it.hitX) it.vx *= -1; if (it.y > H + 50) { S.items.splice(i, 1); continue; } }
                if (hit(P, it)) {
                    if (it.k === 'm') { score += 1000; addPop(it.x, it.y - 10, '+1000'); if (!P.big) { setForm(true, P.mount); P.freeze = 30; } S.items.splice(i, 1); }
                    else if (it.k === 'y' && !P.mount) { setForm(P.big, true); addPop(it.x, it.y - 10, '¡YOSHI!'); S.items.splice(i, 1); }
                }
            }
            for (const e of S.en) {
                if (!e.alive) { if (e.sq > 0) e.sq--; continue; }
                if (e.k === 'b') {
                    e.t++; e.bx += Math.sign(P.x - e.bx) * .35 * (Math.abs(P.x - e.bx) < 500);
                    e.x = e.bx + Math.sin(e.t * .03) * 40; e.y = e.by + Math.sin(e.t * .045) * 70;
                } else if (e.k === 'p') {
                    e.t += .015;
                    const cycle = (e.t % 4 + 4) % 4;
                    e.up = cycle < 2 ? Math.min(1, e.up + .015) : Math.max(0, e.up - .015);
                    e.y = e.baseY + (50 - e.up * 50);
                } else if (e.k === 'c') {
                    e.t += .05;
                    if (e.axis === 'x') { e.x += e.vx; if (e.x < 0 || e.x > S.w - 44) e.vx *= -1; }
                    else { e.y += e.vy; if (e.y < 40 || e.y > H - 70) e.vy *= -1; }
                } else {
                    if (Math.abs(e.x - (cam + W / 2)) > W) continue;
                    e.vx = e.shell === 1 ? 0 : e.shell === 2 ? e.sd * 7 : e.d * e.sp; move(e, S.grav);
                    if (e.kick > 0) e.kick--;
                    if (e.hitX) { if (e.shell === 2) e.sd *= -1; else e.d *= -1; }
                    if (e.k === 'k' && !e.shell && e.ground && !solidAt(e.x + (e.d > 0 ? e.w + 4 : -4), e.y + e.h + 4)) e.d *= -1;
                    if (e.shell === 1 && ++e.st > 420) { e.shell = 0; e.y -= 16; e.h = 40; }
                    if (e.shell === 2) for (const o of S.en) if (o !== e && o.alive && o.k !== 'b' && hit(e, o)) { o.alive = 0; o.sq = 20; score += 100; addPop(o.x, o.y - 10, '+100'); }
                    if (e.y > H + 100) { e.alive = 0; continue; }
                }
                if (hit(P, e)) {
                    const pb = P.y + P.h - P.vy, top = P.vy > 0 && pb <= e.y + 14;
                    if (e.k === 'k' && e.shell) {
                        if (e.shell === 1) { if (!e.kick) { e.shell = 2; e.sd = P.x + P.w / 2 < e.x + e.w / 2 ? 1 : -1; e.kick = 20; if (top) { P.vy = -7; score += 100; addPop(e.x, e.y - 10, '+100'); } } }
                        else if (top) { e.shell = 1; e.st = 0; e.kick = 15; P.vy = -7; }
                        else if (!e.kick) hurt();
                    } else if (top && e.k === 'g') { P.vy = upKey() ? -11 : -7; score += 100; addPop(e.x, e.y - 10, '+100'); e.alive = 0; e.sq = 20; }
                    else if (top && e.k === 'k') { P.vy = upKey() ? -11 : -7; score += 100; e.shell = 1; e.st = 0; e.kick = 15; e.y += e.h - 24; e.h = 24; e.vx = 0; }
                    else if (e.k === 'p' || e.k === 'c') { hurt(); }
                    else if (!top) hurt();
                }
            }
            const D = S.D;
            if (D) {

                sc.background = skyTex([[0, '#0a0202'], [.6, '#2a0808'], [1, '#6a1a08']]); sc.fog = new THREE.Fog('#2a0a06', 16, 70);
                amb.color.set('#ff9a80'); sun.color.set('#ffb080'); amb.intensity = .6 * CFG.ambBoost; sun.intensity = .6 * CFG.sunBoost; torch.intensity = 1.2; fill.intensity = 1.4;
                const wt = T((g, s) => { g.fillStyle = '#2a1414'; g.fillRect(0, 0, s, s); g.fillStyle = '#3a1c1c'; for (let y = 0; y < s; y += 32)for (let x = -(y / 32 % 2) * 32; x < s; x += 64)g.fillRect(x + 2, y + 2, 60, 28); }); wt.repeat.set((W3 + 60) / 4, 5);
                A(Mm(PL, LM('#fff', { map: wt, emissive: '#200808' }), W3 + 60, 20, 1), W3 / 2, 7, -12);
                // Antorchas simples (sin animación de llama pesada)
                const nc = Math.ceil(W3 / 10) + 4;
                for (let i = 0; i < nc; i++) {
                    const x = i * 10 - 2;
                    A(Mm(BOX, LM('#6a6a78'), 1.6, 16, 1.6), x, 8, -6);
                    A(Mm(BOX, LM('#8a8a98'), 2.2, .5, 2.2), x, 2.2, -6);
                    A(Mm(BOX, LM('#8a8a98'), 2.2, .5, 2.2), x, 15.7, -6);
                    A(Mm(SPH, BM('#ff9020'), .22, .34, .22), x + 1.5, 5.2, -5);
                }
                const lt = T((g, s) => { g.fillStyle = '#ff5a00'; g.fillRect(0, 0, s, s); for (let i = 0; i < 26; i++) { g.fillStyle = i % 3 ? '#ffb020' : '#a01800'; g.beginPath(); g.arc(rnd(i) * s, rnd(i + 40) * s, 6 + rnd(i + 80) * 12, 0, 7); g.fill(); } }, 128); lt.repeat.set((W3 + 80) / 8, 5);
                lava = A(Mm(PL, BM('#fff', { map: lt }), W3 + 80, 40, 1), W3 / 2, 1.1, -2); lava.rotation.x = -Math.PI / 2;
                anims.push(() => { lt.offset.x += .0008; lt.offset.y += .0004; torch.intensity = 1 + .25 * Math.sin(frame * .31); fill.intensity = 1.4 + .4 * Math.sin(frame * .07); fill.position.set(cx3, 2.2, 3); });
            }
        }

        /* ---- Cámara ---- */
        let cx3 = 0, cy3 = 7, camFirst = 1;
        function camUpdate() {
            const tx = (cam + W / 2) * k, pyc = (H - (P.y + P.h / 2)) * k, ty = 7.03 + (pyc - 7.03) * .25;
            if (camFirst) { cx3 = tx; cy3 = ty; camFirst = 0; } else { cx3 += (tx - cx3) * CFG.camLerp; cy3 += (ty - cy3) * CFG.camLerp; }
            shk *= .9; const sx = (Math.random() - .5) * shk * CFG.shake * 2, sy = (Math.random() - .5) * shk * CFG.shake * 2;
            cam3.position.set(cx3 + CFG.camSide + sx, cy3 + CFG.camTilt + sy, CFG.camDist); cam3.lookAt(cx3, cy3 - .4, 0);
            sun.position.set(cx3 + 10, 22, 15); sun.target.position.set(cx3, 3, 0); torch.position.set(cx3, 6, 4);
        }

        /* ---- Render ---- */
        function render3() {
            seen = new Set(); const Y = y => (H - y) * k;
            for (const s of S.solids) {
                const o = getM(s, () => mkSolid(s));
                const by = s.bump > 0 ? Math.sin(s.bump / 10 * Math.PI) * 8 * k : 0; o.position.set((s.x + s.w / 2) * k, Y(s.y + s.h / 2) + by, 0);
                if (o.bl && (s.t === 'q' || s.t === 'u')) o.bl.material = MT[s.t];
                if (o.ar) o.ar.position.y = s.h * k / 2 + 1 + Math.sin(frame * .1) * .25;
            }
            MT.q.emissive.setScalar(.12 + .1 * Math.sin(frame * .1));
            if (S.goal) { const g = getM(S.goal, mkFlag); g.position.set((S.goal.x + 3) * k, Y(S.goal.y + S.goal.h), 0); g.f.rotation.y = Math.sin(frame * .1) * .3; }
            for (const it of S.items) {
                if (it.k === 'm') { const o = getM(it, () => mk3('mush')); o.position.set((it.x + 14) * k, Y(it.y + 28), 0); o.rotation.y = Math.sin(frame * .08) * .4; }
                else { const o = getM(it, () => mk3('yoshi')); o.scale.x = -1; o.position.set((it.x + 24) * k, Y(it.y + 46) + Math.abs(Math.sin(frame * .08)) * .15, 0); }
            }
            for (const e of S.en) {
                if (!e.alive && !(e.sq > 0 && e.k !== 'b' && e.k !== 'p' && e.k !== 'c')) continue;
                if (e.k === 'k' && e.shell && e.alive) { const sh = getM(e.shk || (e.shk = {}), mkShell); sh.position.set((e.x + e.w / 2) * k + (e.shell === 1 && e.st > 330 ? Math.sin(frame) * .04 : 0), Y(e.y + e.h), 0); sh.rotation.y = e.shell === 2 ? frame * .5 : 0; continue; }
                // Planta: boca se abre HACIA ARRIBA (mandíbula superior se eleva)
                if (e.k === 'p') {
                    const o = getM(e, () => mkPlant());
                    o.position.set((e.x + e.w / 2) * k, Y(e.y + e.h), 0);
                    o.rotation.y = Math.sin(frame * .03 + e.x * .01) * .15;
                    o.visible = e.up > 0.02;
                    if (o.parts && o.parts.jaw) {
                        // Rotación NEGATIVA en X = se levanta el frente (se abre hacia arriba)
                        const open = (Math.sin(frame * .15 + e.x * .05) + 1) * 0.5;
                        o.parts.jaw.rotation.x = -open * 0.55;
                    }
                    continue;
                }
                if (e.k === 'c') {
                    const o = getM(e, () => mkFish());
                    o.position.set((e.x + e.w / 2) * k, Y(e.y + e.h), 0);
                    const dir = e.axis === 'x' ? (e.vx >= 0 ? 1 : -1) : (e.vy >= 0 ? 1 : -1);
                    o.scale.x = (e.axis === 'x' && dir < 0) ? -1 : 1;
                    o.rotation.z = Math.sin(frame * .08 + e.x * .02) * .1;
                    continue;
                }
                const o = getM(e, () => mk3(e.k === 'g' ? 'goom' : e.k === 'k' ? 'koop' : 'bloo'));
                o.position.set((e.x + e.w / 2) * k, Y(e.y + e.h), 0); o.scale.set(1, 1, 1); o.rotation.z = 0;
                if (!e.alive) { o.scale.y = 10 / e.h; continue; }
                if (e.k === 'g') { const w = Math.sin(frame * .3 + e.x * .1); o.l.position.set(w * .12, Math.max(0, -w) * .12, 0); o.r.position.set(-w * .12, Math.max(0, w) * .12, 0); o.rotation.z = w * .05; }
                else if (e.k === 'k') { const w = Math.sin(frame * .3 + e.x * .1); o.scale.x = e.d < 0 ? -1 : 1; o.l.position.set(w * .12, Math.max(0, -w) * .12, 0); o.r.position.set(-w * .12, Math.max(0, w) * .12, 0); }
                else { o.scale.y = 1 + Math.sin(e.t * .3) * .12; o.scale.x = 1 - Math.sin(e.t * .3) * .06; }
            }
            const D = S.D;
            if (D) {
                const o = getM(D, mkDrag); o.position.set((D.x + 48) * k, Y(D.y + D.h), 0);
                o.visible = !((D.inv > 0 && frame % 4 < 2) || (D.dying && frame % 6 < 3));
                o.m.scale.y = 1 + Math.sin(frame * .07) * .025; o.m.scale.x = 1 - Math.sin(frame * .07) * .012; o.f.scale.x = Math.max(.001, D.hp / 5); o.f.position.x = -1.45 * (1 - D.hp / 5);
                if (D.dying) { o.rotation.z += .02; o.position.y -= .02 * (70 - D.dying); }
                if (D.t % 120 > 95 && frame % 3 === 0) spawnFx(D.x, D.y + 30, '#ff7a00', 1);
                for (const f of S.fb) {
                    const o2 = getM(f, () => { const g = new THREE.Group(), a = new THREE.Mesh(SPH, BM('#ff7a00')), b = new THREE.Mesh(SPH, BM('#ffe040')); a.scale.set(.82, .46, .6); b.scale.set(.5, .26, .65); g.add(a, b); return g; });
                    o2.position.set((f.x + 13) * k, Y(f.y + 7), 0); if (frame % 4 === 0) spawnFx(f.x + 20, f.y + 7, '#ff9020', 1);
                }
            }
            for (const c of S.chips) { const o = getM(c, () => { const m = new THREE.Mesh(BOX, MT.b); m.scale.setScalar(.45); return m; }); o.position.set((c.x + 7) * k, Y(c.y + 7), .3); o.rotation.set(c.t * .2, c.t * .15, 0); }
            for (const p of S.pop) { const o = getM(p, () => popSpr(p.txt)); o.position.set((p.x + 16) * k, Y(p.y), 1.5); }
            /* jugador */
            const mo = P.mount ? 26 : 0, s = P.sh / 32, pm = getM(P, () => mk3('mario'));
            const vis = !(P.inv > 0 && frame % 6 < 3 && !P.dead); pm.visible = vis;
            pm.position.set((P.x + P.w / 2) * k, Y(P.y + P.h - mo), .45);
            const walk = P.ground && Math.abs(P.vx) > .6 && !P.dead, ph = frame * .4;
            pm.position.y += walk ? Math.abs(Math.sin(ph)) * .06 : 0; pm.rotation.z = P.dead ? pm.rotation.z + .25 : (walk ? Math.sin(ph) * .04 : 0); const sw = walk ? Math.sin(ph) : 0, air = !P.ground && !P.dead; pm.l.position.set(air ? -.07 : sw * .15, air ? .1 : Math.max(0, -sw) * .14, 0); pm.r.position.set(air ? .07 : -sw * .15, air ? .14 : Math.max(0, sw) * .14, 0);
            pm.scale.set((P.face < 0 ? -1 : 1) * s * (P.ground ? 1 : .95), s * (P.ground ? 1 : 1.07), s);
            if (P.mount) { const y = getM(MD, () => mk3('yoshi')); y.visible = vis; y.position.set((P.x + 24) * k, Y(P.y + P.h) + (walk ? Math.abs(Math.sin(ph)) * .08 : 0), 0); y.scale.x = P.face < 0 ? -1 : 1; }
            for (const [o, m] of M) if (!seen.has(o)) { dyn.remove(m); M.delete(o); }
            /* partículas y ambiente */
            for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; f.t--; f.vy -= .006; f.m.position.x += f.vx; f.m.position.y += f.vy; f.m.position.z += f.vz; f.m.scale.setScalar(Math.max(.05, f.t / 40)); if (f.t <= 0) { fxg.remove(f.m); fx.splice(i, 1); } }
            for (const f of anims) f();
            camUpdate(); R.render(sc, cam3);
        }

        /* ---------- HUD ---------- */
        function txt(s, x, y, size, col) { ctx.font = 'bold ' + size + 'px "Courier New",monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(s, x + 2, y + 2); ctx.fillStyle = col || '#fff'; ctx.fillText(s, x, y); }
        function heart(x, y, on) { ctx.save(); ctx.translate(x, y); ctx.fillStyle = on ? '#ff3b3b' : '#3a2a2a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(10, 18); ctx.bezierCurveTo(-6, 6, 2, -4, 10, 4); ctx.bezierCurveTo(18, -4, 26, 6, 10, 18); ctx.fill(); ctx.stroke(); ctx.restore(); }
        function drawHUD() {
            ctx.clearRect(0, 0, W, H); if (!S) return;
            ctx.textAlign = 'left'; ctx.font = 'bold 18px "Courier New",monospace';
            ctx.fillStyle = '#000'; ctx.fillText('VIDAS', 22, 32); ctx.fillText('PUNTOS ' + String(score).padStart(5, '0'), 602, 32);
            ctx.fillStyle = '#fff'; ctx.fillText('VIDAS', 20, 30); ctx.fillText('PUNTOS ' + String(score).padStart(5, '0'), 600, 30);
            const L = Math.max(0, lives); for (let i = 0; i < Math.max(3, L); i++)heart(90 + i * 24, 13, i < L);
            txt(NAMES[S.name], W / 2, 30, 16, '#ffe040');
            if (fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, fade) + ')'; ctx.fillRect(0, 0, W, H); }
            if (state !== 'play') {
                ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, W, H);
                if (state === 'title') { txt('SUPER PLATAFORMAS', W / 2, 170, 44, '#f8c030'); txt('Tierra → Agua → Castillo · ¡Derrota al dragón!', W / 2, 220, 18); txt('← → mover · ↑ saltar/nadar · ↓ / S tubería', W / 2, 255, 16); txt('Pulsa ENTER para jugar', W / 2, 320, 24, '#7cf'); }
                else if (state === 'over') { txt('GAME OVER', W / 2, 200, 54, '#e52521'); txt('Puntos: ' + score, W / 2, 250, 24); txt('Pulsa ENTER para reintentar', W / 2, 310, 20, '#7cf'); }
                else { txt('¡VICTORIA!', W / 2, 200, 56, '#f8c030'); txt('Puntos: ' + score, W / 2, 250, 26); txt('Pulsa ENTER para jugar de nuevo', W / 2, 310, 20, '#7cf'); }
            }
        }

        /* ---------- Bucle ---------- */
        load('land', false);
        let last = 0, acc = 0;
        function loop(t) {
            acc += Math.min(100, t - last); last = t;
            while (acc >= 16.667) { update(); acc -= 16.667; pressed = {}; }
            render3(); drawHUD(); requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
